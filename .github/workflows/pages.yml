name: Deploy STAR CREDIT to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate game source
        id: source
        run: |
          if [ -f package.json ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f shooting_game/package.json ]; then
            echo "directory=shooting_game" >> "$GITHUB_OUTPUT"
          else
            echo "Game package.json is missing" >&2
            exit 1
          fi
      - run: npm test
        working-directory: ${{ steps.source.outputs.directory }}
      - run: npm run build
        working-directory: ${{ steps.source.outputs.directory }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.source.outputs.directory }}/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
