<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 5 確認フィクスチャ</title><link rel="stylesheet" href="/src/style.css"></head>
<body><main><header><span class="eyebrow">VERTICAL FLIGHT / 01</span><h1>STAR<span> CREDIT</span></h1><p>回収して、強化して、星域を突破する。</p></header><section class="cabinet"><div id="hud"></div><div class="viewport"><canvas id="game" width="480" height="800" aria-label="縦スクロールシューティングの戦闘画面"></canvas><div id="overlay"></div></div><footer><span id="movement-help">WASD / 矢印：移動</span><button id="weapon">SPACE：武器</button><button id="upgrade">U：強化</button><button id="pause">ESC：停止</button></footer></section><p class="note">終了処理の確認用。180秒直後のボス撃破を再現。保存はメモリのみ。</p></main><script type="module">
let source=await (await fetch('/src/main.js')).text();
source=source.replace(/from '\.\/(.*?)'/g,(_,file)=>`from '${new URL('/src/'+file,location.href).href}'`);
source=source.replace('storage=localStorage;', 'storage={getItem:()=>null,setItem(){}};');
source=source.replace('menu();requestAnimationFrame(frame);', `menu();overlay.querySelector('.panel').append(button('クリアと記録を検証',()=>{start();run.time=180;update(.01);run.enemies[0].hp=0;update(.01);}));requestAnimationFrame(frame);`);
const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));await import(url);URL.revokeObjectURL(url);
</script></body></html>
