<!doctype html><html lang="ja"><meta charset="utf-8"><title>Phase 3 音声確認</title><body style="background:#081224;color:#e8f0ff;font:16px system-ui;padding:24px"><h1>Phase 3 音声確認（仮合成音源）</h1><p>ゲームとは独立。保存設定を変更しません。</p><button id="unlock">音声を有効化</button><div id="buttons"></div><pre id="status"></pre><script type="module">
import {createAudioManager} from '/src/audio/audioManager.js';
const a=createAudioManager(),out=document.querySelector('#status');
function show(){out.textContent=JSON.stringify(a.status,null,2);}
const names={title:'タイトル',battle:'戦闘',boss:'ボス',paused:'停止',shop:'ショップ',hidden:'非表示相当',clear:'クリア',over:'ゲームオーバー'};
for(const [key,label] of Object.entries(names)){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{a.setScene(key);show();};document.querySelector('#buttons').append(b);}
document.querySelector('#unlock').onclick=async()=>{await a.unlock();show();};
setInterval(()=>{a.tick();show();},50);show();
</script></body></html>
