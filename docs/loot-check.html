<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ドロップ・育成検証</title><link rel="stylesheet" href="/src/style.css"></head><body><main><header><span class="eyebrow">VERTICAL FLIGHT / 01</span><h1>STAR<span> CREDIT</span></h1><p>回収して、強化して、星域を突破する。</p></header><section class="cabinet"><div id="hud"></div><div class="viewport"><canvas width="480" height="800" aria-label="比較用戦闘画面"></canvas><div id="overlay"></div></div><footer><span>WASD / 矢印：移動</span><button id="weapon">SPACE：武器</button><button id="upgrade">U：強化</button><button id="pause">ESC：停止</button></footer></section><p class="note">ドロップ・育成の確認用。保存はメモリだけを使用します。</p></main><script type="module">
// 本番と同じupdate/render/frameを、境界直前から検証。記録はメモリのみ。
let source=await (await fetch('/src/main.js')).text();
source=source.replace(/from '\.\/(.*?)'/g,(_,file)=>`from '${new URL('/src/'+file,location.href).href}'`);
source=source.replace('storage=localStorage;', 'storage={getItem:()=>null,setItem(){}};');
source=source.replace('menu();requestAnimationFrame(frame);', `menu();const check=button('武器ドロップ・Lv.2を検証',()=>{start('endless');run.endlessSpawn=999;let rolls=0;run.inventory.random=()=>rolls++%2===0?0:.999;for(let n=0;n<3;n++){run.enemies.push({id:id(),type:0,variant:'recon',name:'偵察機',x:240,y:650,baseX:240,r:17,hp:0,maxHp:3,speed:0,reward:15,age:0,fire:999});for(let i=0;i<16;i++)update(.01);}change('shop');});overlay.querySelector('.panel').append(check);requestAnimationFrame(frame);`);
const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));await import(url);URL.revokeObjectURL(url);
</script></body></html>
