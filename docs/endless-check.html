<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>エンドレス境界検証</title><link rel="stylesheet" href="/src/style.css"></head><body><main><header><span class="eyebrow">VERTICAL FLIGHT / 01</span><h1>STAR<span> CREDIT</span></h1><p>回収して、強化して、星域を突破する。</p></header><section class="cabinet"><div id="hud"></div><div class="viewport"><canvas width="480" height="800" aria-label="比較用戦闘画面"></canvas><div id="overlay"></div></div><footer><span>WASD / 矢印：移動</span><button id="weapon">SPACE：武器</button><button id="upgrade">U：強化</button><button id="pause">ESC：停止</button></footer></section><p class="note">境界確認用：44.9秒から本番更新。セーブは書き込みません。</p></main><script type="module">
// 本番と同じupdate/render/frameを、境界直前から検証。記録はメモリのみ。
let source=await (await fetch('/src/main.js')).text();
source=source.replace(/from '\.\/(.*?)'/g,(_,file)=>`from '${new URL('/src/'+file,location.href).href}'`);
source=source.replace('storage=localStorage;', 'storage={getItem:()=>null,setItem(){}};');
source=source.replace('menu();requestAnimationFrame(frame);', `menu();const check=button('フェーズ境界から実行',()=>{start('endless');run.time=44.9;run.phaseStarted=0;run.enemies=[];run.hostiles.push({id:id(),x:100,y:250,vx:10,vy:80,r:5});run.items.push({id:id(),x:240,y:650,value:25});});overlay.querySelector('.panel').append(check);requestAnimationFrame(frame);`);
const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));await import(url);URL.revokeObjectURL(url);
</script></body></html>
