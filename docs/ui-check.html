<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081224"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="STAR CREDIT"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/src/assets/icons/apple-touch-icon.png"><title>UI分離・戦闘内装備の検証</title><link rel="stylesheet" href="/src/style.css"></head>
<body><main><header><span class="eyebrow">VERTICAL FLIGHT / 01</span><h1>STAR<span> CREDIT</span></h1><p>回収して、強化して、星域を突破する。</p></header><section class="cabinet"><div id="hud"></div><aside id="player-panel" class="desktop-side"></aside><div class="viewport"><canvas id="game" width="480" height="800" aria-label="縦スクロールシューティングの戦闘画面"></canvas><div id="overlay"></div></div><aside id="equipment-panel" class="desktop-side"></aside><footer><span id="movement-help">WASD / 矢印：移動</span><button id="weapon">装備</button><button id="upgrade">U：強化</button><button id="pause">ESC：停止</button></footer></section><p class="note">1 STAGE · 3 WAVES · BOSS ENCOUNTER</p></main><script type="module">
// Isolated in-memory saves; no user progress is read or written.
let source=await (await fetch('/src/main.js')).text();
source=source.replace(/from '\.\/(.*?)'/g,(_,file)=>`from '${new URL('/src/'+file,location.href).href}'`);
source=source.replace('storage=localStorage;', 'storage=(()=>{const m=new Map();return {getItem:k=>m.get(k),setItem:(k,v)=>m.set(k,v)};})();');
source=source.replace('menu();requestAnimationFrame(frame);', `menu();overlay.querySelector('.panel').append(button('戦闘内装備を検証',()=>{start('endless');run.endlessSpawn=999;let rolls=0;for(let n=0;n<4;n++){run.inventory.random=()=>rolls++%2===0?0:n===3?.25:.999;run.enemies.push({id:id(),type:0,variant:'recon',name:'偵察機',x:240,y:650,baseX:240,r:17,hp:0,maxHp:3,speed:0,reward:15,age:0,fire:999});for(let i=0;i<16;i++)update(.01);}openEquipment();}));window.addEventListener('keydown',e=>{if(e.code==='F10'&&state==='playing')end(false);});requestAnimationFrame(frame);`);
const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));await import(url);URL.revokeObjectURL(url);
</script></body></html>
